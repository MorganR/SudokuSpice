  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased.Rules
  summary: >-
    Constructs a rule that will enforce that the given <code class="paramref">squares</code> are

    magic squares based on the rows, columns, and, optionally, the diagonals.


    Unlike other rules, this rule can only be constructed for a specific puzzle size.

    Attempting to initialize this rule with an incompatible puzzle will fail.
  example: []
  syntax:
    content: public MagicSquaresRule(int size, IEnumerable<Box> squares, bool includeDiagonals)
    parameters:
    - id: size
      type: System.Int32
      description: The size of the puzzle this rule applies to.
    - id: squares
      type: System.Collections.Generic.IEnumerable{SudokuSpice.Box}
      description: >-
        The locations of the magic squares. The squares' size must be the square root of the

        puzzle <code class="paramref">size</code>.
    - id: includeDiagonals
      type: System.Boolean
      description: If true, values along the diagonals of the square must also sum to the magic number.
    content.vb: Public Sub New(size As Integer, squares As IEnumerable(Of Box), includeDiagonals As Boolean)
  overload: SudokuSpice.RuleBased.Rules.MagicSquaresRule.#ctor*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      If the any of the given <code class="paramref">squares</code>' sizes are not compatible with the

      given puzzle's <code class="paramref">size</code>.
