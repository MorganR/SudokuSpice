  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased.Rules
  summary: Tries to initialize this rule to prepare to solve the given puzzle.
  remarks: >-
    In general, it doesn't make sense to want to maintain the previous state if this method

    fails. Therefore, it is <em>not</em> guaranteed that the rule's state is unchanged on 

    failure.
  example: []
  syntax:
    content: public bool TryInit(IReadOnlyPuzzle puzzle, BitVector uniquePossibleValues)
    parameters:
    - id: puzzle
      type: SudokuSpice.IReadOnlyPuzzle
      description: The puzzle to be solved.
    - id: uniquePossibleValues
      type: SudokuSpice.BitVector
      description: All the unique possible values for this puzzle.
    return:
      type: System.Boolean
      description: False if the puzzle violates this rule and initialization fails, else true.
