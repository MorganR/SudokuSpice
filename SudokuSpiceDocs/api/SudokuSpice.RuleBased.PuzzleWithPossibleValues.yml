  namespace: SudokuSpice.RuleBased
  summary: >-
    Constructs a new puzzle backed by the given array.


    The puzzle is backed directly by this array (i.e. modifying the array

    modifies the puzzle, and vice-versa). If this is not what you want, see

    <xref href="SudokuSpice.RuleBased.PuzzleWithPossibleValues.CopyFrom(System.Nullable%7bSystem.Int32%7d%5b0%3a%2c0%3a%5d)" data-throw-if-not-resolved="false"></xref> and <xref href="SudokuSpice.RuleBased.PuzzleWithPossibleValues.CopyFrom(System.Nullable%7bSystem.Int32%7d%5b%5d%5b%5d)" data-throw-if-not-resolved="false"></xref>. Note that all

    future modifications should be done through this puzzle object, else this will be in an

    incorrect state.
