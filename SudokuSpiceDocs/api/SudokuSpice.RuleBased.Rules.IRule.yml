    id: Revert
    path: ../SudokuSpice/RuleBased/Rules/IRule.cs
    startLine: 63
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased.Rules
  summary: >-
    Undoes an update for the given value at the specified coordinate. Tracks affected

    coordinates in the given tracker.
  remarks: This method will always be called before reverting the value on the underlying puzzle.
  example: []
  syntax:
    content: void Revert(in Coordinate c, int val, CoordinateTracker coordTracker)
    parameters:
    - id: c
      type: SudokuSpice.Coordinate
      description: The coordinate where a value is being unset.
    - id: val
      type: System.Int32
      description: The value being unset.
    - id: coordTracker
      type: SudokuSpice.CoordinateTracker
      description: >-
        The coordinates of unset squares impacted by this change will be tracked in this

        tracker.
    content.vb: Sub Revert(c As Coordinate, val As Integer, coordTracker As CoordinateTracker)
  overload: SudokuSpice.RuleBased.Rules.IRule.Revert*
  nameWithType.vb: IRule.Revert(Coordinate, Integer, CoordinateTracker)
  fullName.vb: SudokuSpice.RuleBased.Rules.IRule.Revert(SudokuSpice.Coordinate, Integer, SudokuSpice.CoordinateTracker)
  name.vb: Revert(Coordinate, Integer, CoordinateTracker)
