- uid: SudokuSpice.RuleBased.Rules.IRule.GetPossibleValues(SudokuSpice.Coordinate@)
  commentId: M:SudokuSpice.RuleBased.Rules.IRule.GetPossibleValues(SudokuSpice.Coordinate@)
  id: GetPossibleValues(SudokuSpice.Coordinate@)
  parent: SudokuSpice.RuleBased.Rules.IRule
  langs:
  - csharp
  - vb
  name: GetPossibleValues(in Coordinate)
  nameWithType: IRule.GetPossibleValues(in Coordinate)
  fullName: SudokuSpice.RuleBased.Rules.IRule.GetPossibleValues(in SudokuSpice.Coordinate)
  type: Method
  source:
    remote:
      path: SudokuSpice/RuleBased/Rules/IRule.cs
      branch: master
      repo: https://github.com/MorganR/SudokuSpice
    id: GetPossibleValues
    path: ../SudokuSpice/RuleBased/Rules/IRule.cs
    startLine: 32
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased.Rules
  summary: Gets the possible values for the given coordinate based on this rule.
  remarks: >-
    When implementing this method, avoid depending on dynamic information in the current

    puzzle being solved, such as the currently set values. This method must return

    information that reflects the most recent calls to

    <xref href="SudokuSpice.RuleBased.Rules.IRule.Update(SudokuSpice.Coordinate%40%2cSystem.Int32%2cSudokuSpice.CoordinateTracker)?text=Update" data-throw-if-not-resolved="false"></xref>

    or <xref href="SudokuSpice.RuleBased.Rules.IRule.Revert(SudokuSpice.Coordinate%40%2cSystem.Int32%2cSudokuSpice.CoordinateTracker)?text=Revert" data-throw-if-not-resolved="false"></xref>, as it can

    be called before or after modifying the underlying puzzle's data.
  example: []
  syntax:
    content: BitVector GetPossibleValues(in Coordinate c)
    parameters:
    - id: c
      type: SudokuSpice.Coordinate
    return:
      type: SudokuSpice.BitVector
      description: The possible values represented as a <xref href="SudokuSpice.BitVector" data-throw-if-not-resolved="false"></xref>.
    content.vb: Function GetPossibleValues(c As Coordinate) As BitVector
  overload: SudokuSpice.RuleBased.Rules.IRule.GetPossibleValues*
  nameWithType.vb: IRule.GetPossibleValues(Coordinate)
  fullName.vb: SudokuSpice.RuleBased.Rules.IRule.GetPossibleValues(SudokuSpice.Coordinate)
  name.vb: GetPossibleValues(Coordinate)
