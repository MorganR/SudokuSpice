  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased.Rules
  summary: >-
    Creates a deep copy of this IRule, with any internal <code>IReadOnlyPuzzle</code>

    references updated to the given puzzle.
  example: []
  syntax:
    content: IRule CopyWithNewReference(IReadOnlyPuzzle? puzzle)
    parameters:
    - id: puzzle
      type: SudokuSpice.IReadOnlyPuzzle
      description: >-
        The new puzzle reference to use. To ensure this rule's internal state is correct, this

        puzzle should contain the same data as the current puzzle referenced by this rule.
    return:
      type: SudokuSpice.RuleBased.Rules.IRule
    content.vb: Function CopyWithNewReference(puzzle As IReadOnlyPuzzle) As IRule
