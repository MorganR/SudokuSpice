    id: Revert
    path: ../SudokuSpice/RuleBased/Rules/IRule.cs
    startLine: 48
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased.Rules
  summary: >-
    Undoes an update for the given value at the specified coordinate.


    <p>

    This performs the same internal updates as

    <xref href="SudokuSpice.RuleBased.Rules.IRule.Revert(SudokuSpice.Coordinate%40%2cSystem.Int32%2cSudokuSpice.CoordinateTracker)" data-throw-if-not-resolved="false"></xref>, but without passing

    affected coordinates back to the caller. Therefore this is more efficient in cases

    where the caller already knows all the possible coordinates that could be affected.

    </p>
  remarks: This method will always be called before reverting the value on the underlying puzzle.
  example: []
  syntax:
    content: void Revert(in Coordinate c, int val)
    parameters:
    - id: c
      type: SudokuSpice.Coordinate
      description: The coordinate where a value is being unset.
    - id: val
      type: System.Int32
      description: The value being unset.
    content.vb: Sub Revert(c As Coordinate, val As Integer)
  overload: SudokuSpice.RuleBased.Rules.IRule.Revert*
  nameWithType.vb: IRule.Revert(Coordinate, Integer)
  fullName.vb: SudokuSpice.RuleBased.Rules.IRule.Revert(SudokuSpice.Coordinate, Integer)
  name.vb: Revert(Coordinate, Integer)
