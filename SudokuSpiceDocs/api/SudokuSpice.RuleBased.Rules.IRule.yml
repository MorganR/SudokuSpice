  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased.Rules
  summary: >-
    Updates possible values based on setting the given coordinate to the given value.

    Tracks affected coordinates in the given tracker.
  remarks: This method will always be called before setting the value on the underlying puzzle.
  example: []
  syntax:
    content: void Update(in Coordinate c, int val, CoordinateTracker coordTracker)
    parameters:
    - id: c
      type: SudokuSpice.Coordinate
      description: The coordinate to update.
    - id: val
      type: System.Int32
      description: The value to set <code>c</code> to.
    - id: coordTracker
      type: SudokuSpice.CoordinateTracker
      description: >-
        The coordinates of unset squares impacted by this change will be tracked in this

        tracker.
    content.vb: Sub Update(c As Coordinate, val As Integer, coordTracker As CoordinateTracker)
