  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased
  summary: >-
    Constructs a solver with the given rules and optional heuristic.


    This solver can be used to solve multiple puzzles.
  example: []
  syntax:
    content: public PuzzleSolver(IRuleKeeper ruleKeeper, IHeuristic? heuristic = null)
    parameters:
    - id: ruleKeeper
      type: SudokuSpice.RuleBased.IRuleKeeper
      description: The rule keeper to satisfy when solving puzzles.
    - id: heuristic
      type: SudokuSpice.RuleBased.Heuristics.IHeuristic
      description: >-
        A heuristic to use to solve this puzzle efficiently. Can be set to null to skip using

        heuristics.

        Note that only one heuristic can be provided. To use multiple heuristics, create a

        wrapper heuristic like <xref href="SudokuSpice.RuleBased.Heuristics.StandardHeuristic" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Sub New(ruleKeeper As IRuleKeeper, heuristic As IHeuristic = Nothing)
