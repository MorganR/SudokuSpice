  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased
  summary: >-
    Solves puzzles of the given type.


    This solver uses a rule-based approach based on the <xref href="SudokuSpice.RuleBased.Rules.IRule" data-throw-if-not-resolved="false"></xref>s provided in

    the constructor. An optional heuristic can also be provided.
  remarks: This solver is not thread-safe.
  example: []
  syntax:
    content: 'public class PuzzleSolver<TPuzzle> : IPuzzleSolver<TPuzzle> where TPuzzle : class, IPuzzleWithPossibleValues<TPuzzle>'
    typeParameters:
