    content: public bool TrySolve(TPuzzle puzzle, bool randomizeGuesses = false)
    parameters:
    - id: puzzle
      type: '{TPuzzle}'
      description: The puzzle to solve. This will be solved in place.
    - id: randomizeGuesses
