  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.ConstraintBased
  summary: >-
    An optional objective in an <xref href="SudokuSpice.ConstraintBased.ExactCoverGraph" data-throw-if-not-resolved="false"></xref>. An optional objective is both

    an <xref href="SudokuSpice.ConstraintBased.IObjective" data-throw-if-not-resolved="false"></xref> and an <xref href="SudokuSpice.ConstraintBased.IPossibility" data-throw-if-not-resolved="false"></xref>.


    This can be satisfied if one or more attached <xref href="SudokuSpice.ConstraintBased.IPossibility" data-throw-if-not-resolved="false"></xref> objects are

    selected. Once satisfied, this drops any remaining unknown possibilities, and notifies

    parent objectives that to select this possibility.


    Unlike <xref href="SudokuSpice.ConstraintBased.Objective" data-throw-if-not-resolved="false"></xref>s, this class can be dropped. Dropping this objetive does

    not immediately impact attached possibilities. These possibilities may still be dropped

    or selected, as long as this objective does not become satisfied. If selecting a

    possibility would satisfy a dropped optional objective, then the call to

    <xref href="SudokuSpice.ConstraintBased.IObjective.TrySelectPossibility(SudokuSpice.ConstraintBased.Link)" data-throw-if-not-resolved="false"></xref> will fail.


    All <code>OptionalObjective</code> objects must eventually be descendents of at least one

    <xref href="SudokuSpice.ConstraintBased.Objective" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public sealed class OptionalObjective : IOptionalObjective, IObjective, IPossibility'
