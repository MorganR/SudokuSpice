  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.ConstraintBased
  summary: >-
    Creates an optional objective with the given possibilities attached. This objective

    will be satisfied when <code class="paramref">countToSatisfy</code> of these possibilities are

    selected.


    Note that this results in an <xref href="SudokuSpice.ConstraintBased.OptionalObjective" data-throw-if-not-resolved="false"></xref> with no parent objectives.

    The returned objective must eventually be connected to at least one top-level required

    <xref href="SudokuSpice.ConstraintBased.Objective" data-throw-if-not-resolved="false"></xref> object in order to behave correctly.
  example: []
  syntax:
    content: public static OptionalObjective CreateWithPossibilities(ReadOnlySpan<IPossibility> possibilities, int countToSatisfy)
    parameters:
    - id: possibilities
      type: System.ReadOnlySpan{SudokuSpice.ConstraintBased.IPossibility}
      description: The possibilities that could satisfy this objective.
    - id: countToSatisfy
      type: System.Int32
      description: The number of possibilities that must be selected to satisfy this objective.
    return:
      type: SudokuSpice.ConstraintBased.OptionalObjective
      description: The newly constructed optional objective.
    content.vb: Public Shared Function CreateWithPossibilities(possibilities As ReadOnlySpan(Of IPossibility), countToSatisfy As Integer) As OptionalObjective
  overload: SudokuSpice.ConstraintBased.OptionalObjective.CreateWithPossibilities*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      If the <code class="paramref">countToSatisfy</code> is less than 1 or is impossible with the

      given number of <code class="paramref">possibilities</code>.
