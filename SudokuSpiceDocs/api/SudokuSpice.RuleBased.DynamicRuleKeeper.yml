    id: TrySet
    path: ../SudokuSpice/RuleBased/DynamicRuleKeeper.cs
    startLine: 74
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased
  summary: >-
    Updates possible values based on setting the given coordinate to the given value.


    If this update fails (i.e. it leads to an unset square with no possible values), then it

    returns false and leaves all possible values unchanged.
  example: []
  syntax:
    content: public bool TrySet(in Coordinate c, int value)
    parameters:
    - id: c
      type: SudokuSpice.Coordinate
      description: The coordinate to update.
    - id: value
      type: System.Int32
      description: The value to set <code>c</code> to.
    return:
      type: System.Boolean
      description: True if the possible values have been updated and the rules are still satisfied.
    content.vb: Public Function TrySet(c As Coordinate, value As Integer) As Boolean
  overload: SudokuSpice.RuleBased.DynamicRuleKeeper.TrySet*
