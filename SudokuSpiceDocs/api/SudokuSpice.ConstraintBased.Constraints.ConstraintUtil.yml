  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.ConstraintBased.Constraints
  summary: >-
    Add an <xref href="SudokuSpice.ConstraintBased.OptionalObjective" data-throw-if-not-resolved="false"></xref> connecting all the

    <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref>s at the given <code class="paramref">possibilityIndex</code> on the

    given <code class="paramref">squares</code>. Skips null squares, null possibilities, and any

    possibilities in a known state (i.e. dropped or selected).
  example: []
  syntax:
    content: public static bool TryAddOptionalObjectiveForPossibilityIndex(ReadOnlySpan<Possibility?[]?> squares, int possibilityIndex, int requiredCount, out OptionalObjective? objective)
    parameters:
    - id: squares
      type: System.ReadOnlySpan{SudokuSpice.ConstraintBased.Possibility[]}
      description: The squares to add <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref>s from.
    - id: possibilityIndex
      type: System.Int32
      description: The value index of the possible value within the squares.
    - id: requiredCount
      type: System.Int32
      description: The number of possibilities required to satisfy the new <xref href="SudokuSpice.ConstraintBased.OptionalObjective" data-throw-if-not-resolved="false"></xref>.
    - id: objective
      type: SudokuSpice.ConstraintBased.OptionalObjective
      description: The new optional objective, if successful, else null.
    return:
      type: System.Boolean
      description: >-
        False if the objective could not be added, for example because not enough

        <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref> objects were still possible to satisfy it, else true.
    content.vb: Public Shared Function TryAddOptionalObjectiveForPossibilityIndex(squares As ReadOnlySpan(Of Possibility()), possibilityIndex As Integer, requiredCount As Integer, objective As OptionalObjective) As Boolean
