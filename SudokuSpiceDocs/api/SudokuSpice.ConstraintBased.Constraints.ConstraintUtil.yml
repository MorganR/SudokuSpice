    id: TryDropPossibilitiesAtIndex
    path: ../SudokuSpice/ConstraintBased/Constraints/ConstraintUtil.cs
    startLine: 120
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.ConstraintBased.Constraints
  summary: >-
    Drops <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref>s with the given <code class="paramref">possibilityIndex</code>

    from the given set of <code class="paramref">squares</code>. Null squares and possible values are

    ignored.


    If this returns false, there is no guarantee as to the state of the given

    <code class="paramref">squares</code>. Some may have been dropped.
  example: []
  syntax:
    content: public static bool TryDropPossibilitiesAtIndex(ReadOnlySpan<Possibility?[]?> squares, int possibilityIndex)
    parameters:
    - id: squares
      type: System.ReadOnlySpan{SudokuSpice.ConstraintBased.Possibility[]}
      description: The squares to drop, if not null.
    - id: possibilityIndex
      type: System.Int32
      description: The index of the possibility within the squares.
    return:
      type: System.Boolean
      description: >-
        True if all the <code class="paramref">squares</code> were dropped safely (eg. without

        resulting in any <xref href="SudokuSpice.ConstraintBased.Objective" data-throw-if-not-resolved="false"></xref> that can no longer be satisfied).
    content.vb: Public Shared Function TryDropPossibilitiesAtIndex(squares As ReadOnlySpan(Of Possibility()), possibilityIndex As Integer) As Boolean
  overload: SudokuSpice.ConstraintBased.Constraints.ConstraintUtil.TryDropPossibilitiesAtIndex*
