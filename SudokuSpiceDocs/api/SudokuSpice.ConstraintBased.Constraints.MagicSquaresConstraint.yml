      type: System.ReadOnlySpan{System.Int32}
      description: The possible values that can be in the magic squares.
    - id: squares
      type: System.Collections.Generic.IEnumerable{SudokuSpice.Box}
      description: The locations of the magic squares.
    - id: includeDiagonals
      type: System.Boolean
      description: If true, values along the diagonals of the square must also sum to the magic number.
