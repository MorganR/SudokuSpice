- uid: SudokuSpice.BitVector.PopulateSetBits(System.Span{System.Int32})
  commentId: M:SudokuSpice.BitVector.PopulateSetBits(System.Span{System.Int32})
  id: PopulateSetBits(System.Span{System.Int32})
  parent: SudokuSpice.BitVector
  langs:
  - csharp
  - vb
  name: PopulateSetBits(Span<int>)
  nameWithType: BitVector.PopulateSetBits(Span<int>)
  fullName: SudokuSpice.BitVector.PopulateSetBits(System.Span<int>)
  type: Method
  source:
    remote:
      path: SudokuSpice/BitVector.cs
      branch: master
      repo: https://github.com/MorganR/SudokuSpice
    id: PopulateSetBits
    path: ../SudokuSpice/BitVector.cs
    startLine: 144
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice
  summary: >-
    Populates a provided Span with the indices of set bits, and returns the number of set 

    bits it populated.


    This method will return if it reaches the end of the provided

    <code class="paramref">setIndices</code> span, so if <code class="paramref">setIndices</code> has size N,

    then this will only populate the indices for the first N set bits, and will return N.

    If there are less setBits than N, say M, the values of <code class="paramref">setIndices</code>

    from setIndices[M] to setIndices[N-1] are left unchanged.
  remarks: >-
    This operation is slightly more efficient on average when <xref href="System.Runtime.Intrinsics.X86.Popcnt" data-throw-if-not-resolved="false"></xref> is

    supported. Worst case performance is roughly the same.
  example: []
  syntax:
    content: public readonly int PopulateSetBits(Span<int> setIndices)
    parameters:
    - id: setIndices
      type: System.Span{System.Int32}
      description: A span to fill with the indices of set bits. All values will be written to
    return:
      type: System.Int32
      description: The number of set bits that have been populated into <code class="paramref">setIndices</code>
    content.vb: Public Function PopulateSetBits(setIndices As Span(Of Integer)) As Integer
  overload: SudokuSpice.BitVector.PopulateSetBits*
  nameWithType.vb: BitVector.PopulateSetBits(Span(Of Integer))
  fullName.vb: SudokuSpice.BitVector.PopulateSetBits(System.Span(Of Integer))
  name.vb: PopulateSetBits(Span(Of Integer))
