      repo: https://github.com/MorganR/SudokuSpice
    id: Generate
    path: ../SudokuSpice/RuleBased/StandardPuzzleGenerator.cs
    startLine: 51
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased
  summary: >-
    Generates a puzzle that has a unique solution with the given number of squares set.


    Be careful calling this with low values, as it can take a very long time to generate

    unique puzzles as the value of <code class="paramref">numSquaresToSet</code> approaches the

    minimum number of clues necessary to provide a unique puzzle of the given

    <code class="paramref">puzzleSize</code>.
  example: []
  syntax:
    content: public PuzzleWithPossibleValues Generate(int puzzleSize, int numSquaresToSet, TimeSpan timeout)
    parameters:
    - id: puzzleSize
      type: System.Int32
      description: The size (i.e. side-length) of the puzzle to generate.
    - id: numSquaresToSet
      type: System.Int32
      description: >-
        The number of squares that will be preset in the generated puzzle.


        Valid ranges are 0-1 for puzzles of size 1, 4-16 for puzzles of size 4, 17-81 for

        puzzles of size 9, 55-256 for puzzles of size 16, and 185 - 625 for puzzles of size 25.

        Note that the lower bounds for puzzles sized 16 or 25 are estimates from

        this forum: http://forum.enjoysudoku.com/minimum-givens-on-larger-puzzles-t4801.html
    - id: timeout
      type: System.TimeSpan
      description: >-
        The maximum timeout during which this function can search for a unique puzzle.

        Especially useful when trying to generate puzzles with low

        <code class="paramref">numSquaresToSet</code>.
    return:
      type: SudokuSpice.RuleBased.PuzzleWithPossibleValues
      description: >-
        A standard Sudoku puzzle with a unique solution and <code>numSquaresToSet</code> preset

        squares.
    content.vb: Public Function Generate(puzzleSize As Integer, numSquaresToSet As Integer, timeout As TimeSpan) As PuzzleWithPossibleValues
  overload: SudokuSpice.RuleBased.StandardPuzzleGenerator.Generate*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: Thrown if <code class="paramref">numSquaresToSet</code> is impossible for the given puzzle size.
  - type: System.TimeoutException
    commentId: T:System.TimeoutException
    description: >-
      Thrown if no valid unique puzzle is found within the specified

      <code class="paramref">timeout</code>.
