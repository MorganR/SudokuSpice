  assemblies:
  - SudokuSpice
  namespace: SudokuSpice
  summary: The number of squares for which the solver had to guess while finding a solution.
  remarks: >-
    Unlike <xref href="SudokuSpice.SolveStats.NumTotalGuesses?text=NumTotalGuesses" data-throw-if-not-resolved="false"></xref>, if the solver was

    setting a square that had three possible values, this would only add 1 to

    <code>NumSquaresGuessed</code>. If NumSolutionsFound is greater than 1, then the precise

    meaning of this value is undefined.
  example: []
  syntax:
    content: public int NumSquaresGuessed { readonly get; set; }
