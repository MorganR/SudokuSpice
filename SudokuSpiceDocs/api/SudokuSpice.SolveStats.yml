    startLine: 35
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice
  summary: >-
    The total number of guesses used to solve the puzzle. A 'guess' is any time the

    solver tries setting a square to one value when there are multiple possible values

    for that square.
  remarks: >-
    Example Guesses: if the solver tried to set square (0,1) with possible values [2, 3, 5]

    then this would add three total guesses since there were three possible values for this

    coordinate. This would be true even if only one of the values actually led to a

    solution.
  example: []
  syntax:
    content: public int NumTotalGuesses { readonly get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property NumTotalGuesses As Integer
