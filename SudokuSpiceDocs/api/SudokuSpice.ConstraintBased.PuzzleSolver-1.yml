  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.ConstraintBased
  summary: Solves puzzles of the given type using an <xref href="SudokuSpice.ConstraintBased.ExactCoverGraph" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This class is thread-safe as long as the given constraints' implementations of

    <xref href="SudokuSpice.ConstraintBased.Constraints.IConstraint.TryConstrain(SudokuSpice.IReadOnlyPuzzle%2cSudokuSpice.ConstraintBased.ExactCoverGraph)" data-throw-if-not-resolved="false"></xref> are also

    thread-safe. If that's true, then it's safe to solve multiple puzzles concurrently via

    the same solver object.
  example: []
  syntax:
    content: 'public class PuzzleSolver<TPuzzle> : IPuzzleSolver<TPuzzle> where TPuzzle : class, IPuzzle<TPuzzle>'
