  type: Method
  source:
    remote:
      path: SudokuSpice/ConstraintBased/Constraints/IConstraint.cs
      branch: master
      repo: git@github.com:MorganR/SudokuSpice.git
    id: TryConstrain
    path: ../SudokuSpice/ConstraintBased/Constraints/IConstraint.cs
    startLine: 21
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.ConstraintBased.Constraints
  summary: >-
    Adds necessary <xref href="SudokuSpice.ConstraintBased.IObjective" data-throw-if-not-resolved="false"></xref>s and links to the given

    <code class="paramref">graph</code> in order to solve the given <code class="paramref">puzzle</code>

    according to this constraint. The details here are implementation-specific.
  remarks: >-
    This should skip adding objectives that are already satisfied by the given

    <code class="paramref">puzzle</code>. Instead, it should drop the relevant

    <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref>s that are no longer possible.


    Note: See <xref href="SudokuSpice.ConstraintBased.ExactCoverGraph" data-throw-if-not-resolved="false"></xref> to understand how the graph works.
  example: []
  syntax:
    content: bool TryConstrain(IReadOnlyPuzzle puzzle, ExactCoverGraph graph)
    parameters:
    - id: puzzle
      type: SudokuSpice.IReadOnlyPuzzle
      description: The puzzle to solve.
    - id: graph
      type: SudokuSpice.ConstraintBased.ExactCoverGraph
      description: The exact-cover graph to constrain.
    return:
      type: System.Boolean
      description: False if the constraint could not be satisfied by the given puzzle, else true.
    content.vb: Function TryConstrain(puzzle As IReadOnlyPuzzle, graph As ExactCoverGraph) As Boolean
  overload: SudokuSpice.ConstraintBased.Constraints.IConstraint.TryConstrain*
