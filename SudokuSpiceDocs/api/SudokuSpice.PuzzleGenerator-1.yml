    id: Generate
    path: ../SudokuSpice/PuzzleGenerator.cs
    startLine: 61
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice
  summary: Generates a puzzle that has a unique solution with the given number of squares set.
  remarks: >-
    Be careful calling this with low values, as it can take a very long time to generate

    unique puzzles as the value of <code class="paramref">numSquaresToSet</code> approaches the

    minimum number of clues necessary to provide a unique puzzle of the given

    <code class="paramref">puzzleSize</code>.
  example: []
  syntax:
    content: public TPuzzle Generate(int puzzleSize, int numSquaresToSet, TimeSpan timeout)
    parameters:
    - id: puzzleSize
      type: System.Int32
      description: The size (i.e. side-length) of the puzzle to generate.
    - id: numSquaresToSet
      type: System.Int32
      description: The number of squares that will be preset in the generated puzzle.
    - id: timeout
      type: System.TimeSpan
      description: >-
        The maximum timeout during which this function can search for a unique puzzle.

        Especially useful when trying to generate puzzles with low

        <code class="paramref">numSquaresToSet</code>. Use <code>TimeSpan.Zero</code> to disable the timeout.
    return:
      type: '{TPuzzle}'
      description: >-
        A puzzle of type <code>TPuzzle</code> with a unique solution and

        <code class="paramref">numSquaresToSet</code> preset squares.
    content.vb: Public Function Generate(puzzleSize As Integer, numSquaresToSet As Integer, timeout As TimeSpan) As TPuzzle
  overload: SudokuSpice.PuzzleGenerator`1.Generate*
  exceptions:
  - type: System.TimeoutException
    commentId: T:System.TimeoutException
    description: >-
      Thrown if no valid unique puzzle is found within the specified

      <code class="paramref">timeout</code>.
