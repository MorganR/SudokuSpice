  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased.Heuristics
  summary: >-
    Checks for any squares that are the unique provider of a given possible value within a box.

    Sets the possible values for those squares to just their unique value.


    For example, if a box had three unset squares with possible values: <code>A: [1, 2]</code>,

    <code>B: [1, 2]</code>, and <code>C: [1, 2, 3]</code>, then this would set <code>C</code>'s possible values

    to <code>[3]</code>.
  example: []
  syntax:
    content: 'public class UniqueInBoxHeuristic : IHeuristic'
    content.vb: Public Class UniqueInBoxHeuristic Implements IHeuristic
