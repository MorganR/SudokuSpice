  assemblies:
  - SudokuSpice
  namespace: SudokuSpice
  summary: Solves the given puzzle in place.
  example: []
  syntax:
    content: TPuzzle Solve(TPuzzle puzzle, bool randomizeGuesses = false)
    parameters:
    - id: puzzle
      type: '{TPuzzle}'
      description: The puzzle to solve. This will be copied instead of solved in-place.
    - id: randomizeGuesses
      type: System.Boolean
      description: >-
        If true, this will guess in a random order when forced to guess. Else, the guessing

        order is up to the implementation, but it should be stable.
    return:
      type: '{TPuzzle}'
      description: A solved copy of the given puzzle.
