    path: ../SudokuSpice/ConstraintBased/ExactCoverGraph.cs
    startLine: 33
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.ConstraintBased
  summary: >-
    Holds an exact-cover graph for the current puzzle being solved.


    This is an extension of the

    <a href="https://en.wikipedia.org/wiki/Exact_cover">exact-cover matrix</a> concept. Rows of

    the exact-cover matrix, i.e. a specific location and possible value for that location, are

    represented by <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref> objects. These are linked together by

    <xref href="SudokuSpice.ConstraintBased.IObjective" data-throw-if-not-resolved="false"></xref> objects, which represent the columns of an exact-cover matrix.


    For example, the <xref href="SudokuSpice.ConstraintBased.Constraints.RowUniquenessConstraint" data-throw-if-not-resolved="false"></xref> uses a required 

    <xref href="SudokuSpice.ConstraintBased.Objective" data-throw-if-not-resolved="false"></xref> to link all the <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref> objects on a single row

    that have the same possible value. This way, when one of these possibilities is selected,

    then the others are all dropped.


    To extend the concept into a larger graph, this also uses <xref href="SudokuSpice.ConstraintBased.OptionalObjective" data-throw-if-not-resolved="false"></xref>s

    to create subgroups over <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref> objects and/or other

    <xref href="SudokuSpice.ConstraintBased.OptionalObjective" data-throw-if-not-resolved="false"></xref> objects. This allows for much more complex constraints,

    such as the <xref href="SudokuSpice.ConstraintBased.Constraints.MagicSquaresConstraint" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The ExactCoverGraph adds <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref> objects for all the unset coordinates

    in a puzzle on creation, as well as <xref href="SudokuSpice.ConstraintBased.Objective" data-throw-if-not-resolved="false"></xref> objects that group all the

    possible values for each location. These effectively implements the constraint: "Each

    coordinate in the puzzle must have one and only one value."
  example: []
  syntax:
