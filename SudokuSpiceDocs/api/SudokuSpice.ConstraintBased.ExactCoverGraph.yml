  namespace: SudokuSpice.ConstraintBased
  summary: >-
    Creates an exact-cover graph for solving the given puzzle.


    This adds <xref href="SudokuSpice.ConstraintBased.Possibility" data-throw-if-not-resolved="false"></xref> objects for all the unset coordinates in a puzzle on

    creation, as well as <xref href="SudokuSpice.ConstraintBased.Objective" data-throw-if-not-resolved="false"></xref> objects that group all the possible values

    for each location. These effectively implements the constraint: "Each square in the

    puzzle must have one and only one value."
  example: []
  syntax:
    content: public static ExactCoverGraph Create(IReadOnlyPuzzle puzzle)
    parameters:
    - id: puzzle
      type: SudokuSpice.IReadOnlyPuzzle
      description: The puzzle to solve.
    return:
      type: SudokuSpice.ConstraintBased.ExactCoverGraph
