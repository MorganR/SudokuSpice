  summary: >-
    Gets all the possiblities, grouped by column, on the requested row.


    Indexing the result looks like:


    <code>

    var row = graph.GetSquaresOnRow(rowIndex);

    var possibility = row[columnIndex][valueIndex];

    </code>
  example: []
  syntax:
