  namespace: SudokuSpice
  summary: >-
    Calculates the square root of a number. Only works for integers that have integer

    square roots.


    This is useful for determining the standard box-size for a puzzle (i.e.

    <code class="paramref">toRoot</code> would be the size of the puzzle, and

    <code class="paramref">root</code> would be the size of each box).
  example: []
  syntax:
    content: public static bool TryIntSquareRoot(int toRoot, out int root)
    parameters:
    - id: toRoot
      type: System.Int32
      description: The number to root. Should be the square of another integer.
    - id: root
      type: System.Int32
      description: 'Out parameter: the square root of <code class="paramref">toRoot</code>.'
    return:
      type: System.Boolean
      description: False if <code class="paramref">toRoot</code> is not the square of a whole number.
    content.vb: Public Shared Function TryIntSquareRoot(toRoot As Integer, root As Integer) As Boolean
