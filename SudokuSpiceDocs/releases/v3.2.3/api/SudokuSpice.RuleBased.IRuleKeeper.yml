      repo: git@github.com:MorganR/SudokuSpice.git
    id: TryInit
    path: ../SudokuSpice/RuleBased/IRuleKeeper.cs
    startLine: 39
  assemblies:
  - SudokuSpice
  namespace: SudokuSpice.RuleBased
  summary: >-
    Tries to initialize this rule keeper to solve the given puzzle.


    When reusing a rule keeper to solve multiple puzzles, this must be called with each new

    puzzle to be solved.
  remarks: >-
    In general, it doesn't make sense to want to maintain the previous state if this method

    fails. Therefore, it is <em>not</em> guaranteed that the rule keeper's state is

    unchanged on failure.
  example: []
  syntax:
    content: bool TryInit(IReadOnlyPuzzleWithMutablePossibleValues puzzle)
    parameters:
    - id: puzzle
      type: SudokuSpice.RuleBased.IReadOnlyPuzzleWithMutablePossibleValues
      description: The puzzle to be solved.
    return:
      type: System.Boolean
      description: >-
        False if the rule keeper couldn't be initialized, for example if the puzzle already

        violates one of the rules. Else returns true.
    content.vb: Function TryInit(puzzle As IReadOnlyPuzzleWithMutablePossibleValues) As Boolean
  overload: SudokuSpice.RuleBased.IRuleKeeper.TryInit*
